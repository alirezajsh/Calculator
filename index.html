<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="columns">
        <div id="row1">
            <div id="operation">0</div>
            <div id="result">0</div>
        </div>
            <div class="rows">
                <span id="c" class="red-button">C</span>
                <span id="delete" class="red-button">⌦</span>
                <span id="percent" class="white-button">%</span>
                <span id="divide" class="gray-button">÷</span>
            </div>


            <div class="rows">
                <span id="number7" class="white-button">7</span>
                <span id="number8" class="white-button">8</span>
                <span id="number9" class="white-button">9</span>
                <span id="multiple" class="gray-button">×</span>
            </div>

            <div class="rows">
                <span id="number4" class="white-button">4</span>
                <span id="number5" class="white-button">5</span>
                <span id="number6" class="white-button">6</span>
                <span id="minus" class="gray-button">-</span>
            </div>

            <div class="rows">
                <span id="number1" class="white-button">1</span>
                <span id="number2" class="white-button">2</span>
                <span id="number3" class="white-button">3</span>
                <span id="plus" class="gray-button">+</span>
            </div>

            <div class="rows">
                <span id="parantez" class="white-button"></span>
                <span id="number0" class="white-button">0</span>
                <span id="point" class="white-button">.</span>
                <span id="equal" class="green-button">=</span>
            </div>
            
            
        <div>

        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
